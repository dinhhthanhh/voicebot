<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voicebot Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 860px;
      margin: 24px auto;
      padding: 0 16px;
      color: #222;
    }

    h3 {
      margin-bottom: 16px;
    }

    button {
      font-size: 15px;
      padding: 8px 16px;
      margin-right: 8px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
    }

    button:hover {
      background: #f0f0f0;
    }

    #btnTalk {
      font-weight: bold;
      background: #0066cc;
      color: #fff;
      border-color: #0055aa;
    }

    #btnTalk:hover {
      background: #0055aa;
    }

    .row {
      margin: 14px 0;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      min-height: 44px;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafafa;
    }

    pre.box {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 14px;
      margin: 0;
      background: #fdfdfd;
    }

    #state {
      font-weight: bold;
    }


    #err {
      color: #d32f2f;
      font-weight: 500;
      min-height: 20px;
    }

    #log {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h3>Voicebot</h3>

  <div class="row">
    Trạng thái: <span id="state">Đang kết nối...</span>
  </div>

  <div class="row">
    <button id="btnTalk">Bắt đầu nói</button>
    <button id="btnStop">Ngắt bot</button>
    <button id="btnReset">Hội thoại mới</button>
    <label style="cursor:pointer;"><input type="checkbox" id="chkBarge" checked> Cho phép ngắt bot</label>
  </div>

  <div class="row">
    <b>Bạn:</b>
    <div id="you" class="box"></div>
  </div>

  <div class="row">
    <b>Bot:</b>
    <pre id="bot" class="box"></pre>
  </div>

  <div class="row" id="err"></div>

  <div class="row">
    <b>Độ trễ từng lượt:</b>
    <div id="log" class="box"></div>
  </div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const TARGET_SR = 16000, FRAME_SAMPLES = 4800, TTS_SR = 48000;
      const LABEL = { idle: 'Rảnh', listening: 'Đang nghe...', thinking: 'Đang suy nghĩ', speaking: 'Đang nói' };

      let ws, ctx, micStream, micSource, processor;
      let recording = false, srvState = 'idle', turnNo = 0;
      let buf = new Float32Array(0);
      let playHead = 0, carry = new Uint8Array(0), discarding = false;
      const sources = new Set();
      let tStop = 0, tPlayStart = null, finalInfo = null;

      const sendJson = obj => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); };
      const setErr = msg => { $('err').textContent = msg || ''; };

      // 1. Kết nối WebSocket với máy chủ
      function connect() {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(proto + location.host + '/ws/voice');
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => {
          srvState = 'idle';
          sendJson({ type: 'config', barge_in: $('chkBarge').checked });
          refreshState();
        };
        ws.onclose = () => { $('state').textContent = 'Mất kết nối (Hãy tải lại trang)'; };
        ws.onmessage = onMessage;
      }

      // 2. Cập nhật nhãn trạng thái giao diện
      const isPlaying = () => ctx && playHead > ctx.currentTime + 0.01;
      function refreshState() {
        let s = srvState;
        if (recording) s = 'listening';
        else if (s === 'idle' && isPlaying()) s = 'speaking';
        if (ws && ws.readyState === WebSocket.OPEN) $('state').textContent = LABEL[s] || s;
      }
      setInterval(refreshState, 200);

      // 3. Xử lý thu âm và Resample sang 16kHz
      function resample(input, srcSr, dstSr) {
        if (srcSr === dstSr) return input;
        const ratio = dstSr / srcSr;
        const out = new Float32Array(Math.max(0, Math.round(input.length * ratio)));
        for (let i = 0; i < out.length; i++) {
          const x = i / ratio, x0 = Math.floor(x);
          const x1 = Math.min(x0 + 1, input.length - 1), t = x - x0;
          out[i] = input[x0] * (1 - t) + input[x1] * t;
        }
        return out;
      }

      function toPcm16(f32) {
        const pcm = new Int16Array(f32.length);
        for (let i = 0; i < f32.length; i++) {
          const s = Math.max(-1, Math.min(1, f32[i]));
          pcm[i] = s < 0 ? Math.round(s * 32768) : Math.round(s * 32767);
        }
        return pcm.buffer;
      }

      async function ensureAudio() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') await ctx.resume();
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
            video: false
          });
          micSource = ctx.createMediaStreamSource(micStream);
          processor = ctx.createScriptProcessor(4096, 1, 1);
          processor.onaudioprocess = onMic;
          micSource.connect(processor);

          // Chống dội âm (Anti-feedback): nối qua Gain(0) để kích hoạt processor mà không phát ra loa
          const mute = ctx.createGain();
          mute.gain.value = 0;
          processor.connect(mute);
          mute.connect(ctx.destination);
        }
      }

      function onMic(e) {
        if (!recording || !ws || ws.readyState !== WebSocket.OPEN) return;
        const x = resample(e.inputBuffer.getChannelData(0), ctx.sampleRate, TARGET_SR);
        const merged = new Float32Array(buf.length + x.length);
        merged.set(buf);
        merged.set(x, buf.length);

        let offset = 0;
        while (merged.length - offset >= FRAME_SAMPLES) {
          ws.send(toPcm16(merged.subarray(offset, offset + FRAME_SAMPLES)));
          offset += FRAME_SAMPLES;
        }
        buf = merged.slice(offset);
      }

      function stopTalking() {
        recording = false;
        if (buf.length > 0) {
          ws.send(toPcm16(buf));
          buf = new Float32Array(0);
        }
        tStop = performance.now();
        tPlayStart = null;
        finalInfo = null;
        sendJson({ type: 'stop_turn' });
        $('btnTalk').textContent = 'Bắt đầu nói';
        $('btnTalk').style.background = '#0066cc';
      }

      // 4. Phát luồng âm thanh PCM 48kHz nhận từ máy chủ
      function stopPlayback() {
        for (const src of sources) {
          try { src.stop(); } catch (_) { }
        }
        sources.clear();
        playHead = 0;
        carry = new Uint8Array(0);
        discarding = true;
      }

      function playPcm(arrayBuf) {
        if (!ctx || discarding) return;

        // Giữ byte lẻ lại để ghép với chunk tiếp theo đảm bảo căn chỉnh 16-bit
        const bytes = new Uint8Array(carry.length + arrayBuf.byteLength);
        bytes.set(carry, 0);
        bytes.set(new Uint8Array(arrayBuf), carry.length);

        const even = bytes.length - (bytes.length % 2);
        carry = bytes.slice(even);
        if (even === 0) return;

        const i16 = new Int16Array(bytes.buffer.slice(0, even));
        const f32 = new Float32Array(i16.length);
        for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;

        const audioBuf = ctx.createBuffer(1, f32.length, TTS_SR);
        audioBuf.copyToChannel(f32, 0);

        const source = ctx.createBufferSource();
        source.buffer = audioBuf;
        source.connect(ctx.destination);

        const now = ctx.currentTime;
        if (playHead < now + 0.05) playHead = now + 0.08;
        source.start(playHead);

        if (tPlayStart === null) tPlayStart = performance.now() + (playHead - now) * 1000;
        playHead += audioBuf.duration;
        sources.add(source);
        source.onended = () => sources.delete(source);
      }

      // 5. Xử lý thông điệp từ WebSocket
      function onMessage(ev) {
        if (typeof ev.data !== 'string') {
          playPcm(ev.data);
          return;
        }
        const m = JSON.parse(ev.data);
        switch (m.type) {
          case 'state':
            srvState = m.state;
            if (m.state === 'listening') discarding = false;
            refreshState();
            break;
          case 'partial':
            $('you').textContent = m.text;
            break;
          case 'final':
            $('you').textContent = m.text;
            $('bot').textContent = '';
            finalInfo = m;
            break;
          case 'bot_raw':
            $('bot').textContent += m.text;
            break;
          case 'stop_audio':
            stopPlayback();
            discarding = false;
            break;
          case 'busy':
            setErr('Bot đang nói. Hãy bật "Cho phép ngắt" hoặc đợi bot nói xong.');
            break;
          case 'info':
            setErr(m.message);
            break;
          case 'error':
            setErr(m.message);
            if (recording) {
              recording = false;
              buf = new Float32Array(0);
              $('btnTalk').textContent = 'Bắt đầu nói';
              $('btnTalk').style.background = '#0066cc';
            }
            break;
          case 'metrics':
            logTurn(m);
            break;
        }
      }

      function logTurn(m) {
        turnNo++;
        const f = v => (v === undefined || v === null) ? '-' : v.toFixed(2) + 's';
        const toPlay = tPlayStart ? (tPlayStart - tStop) / 1000 : null;
        $('log').textContent += `Lượt ${turnNo}: dừng→final ${f(finalInfo && finalInfo.stt_final_s)}`
          + ` | LLM đầu ${f(m.first_content)} | câu đầu ${f(m.first_sentence)}`
          + ` | byte TTS đầu ${f(m.first_audio)} | dừng→nghe tiếng ${f(toPlay)}\n`;
      }

      // 6. Gán sự kiện nút bấm
      $('btnTalk').onclick = async () => {
        if (recording) {
          stopTalking();
          return;
        }
        const busy = srvState === 'thinking' || srvState === 'speaking' || isPlaying();
        if (busy && !$('chkBarge').checked) {
          setErr('Bot đang nói. Bật "Cho phép ngắt" hoặc đợi bot nói xong.');
          return;
        }
        try {
          await ensureAudio();
        } catch (e) {
          setErr('Không mở được micro: ' + e.message);
          return;
        }

        stopPlayback(); // Barge-in: ngắt loa ngay lập tức trên trình duyệt
        setErr('');
        $('you').textContent = '';
        $('bot').textContent = '';
        buf = new Float32Array(0);
        recording = true;
        sendJson({ type: 'start_turn' });

        $('btnTalk').textContent = 'Dừng nói';
        $('btnTalk').style.background = '#d32f2f';
      };

      $('btnStop').onclick = () => {
        stopPlayback();
        if (recording) {
          recording = false;
          buf = new Float32Array(0);
          $('btnTalk').textContent = 'Bắt đầu nói';
          $('btnTalk').style.background = '#0066cc';
        }
        sendJson({ type: 'interrupt' });
      };

      $('btnReset').onclick = () => {
        sendJson({ type: 'reset' });
        $('you').textContent = '';
        $('bot').textContent = '';
        setErr('');
      };

      $('chkBarge').onchange = () => {
        sendJson({ type: 'config', barge_in: $('chkBarge').checked });
      };

      connect();
    })();
  </script>
</body>

</html>
