[project]
name = "voice-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "num2words>=0.5.13",
    "numpy>=2.0.0",
    "onnxruntime>=1.20.0",
    "transformers>=4.40.0,<5.0.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 10
