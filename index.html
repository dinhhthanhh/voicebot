<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voicebot Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 860px;
      margin: 24px auto;
      padding: 0 16px;
      color: #222;
    }

    h3 {
      margin-bottom: 16px;
    }

    button {
      font-size: 15px;
      padding: 8px 16px;
      margin-right: 8px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
    }

    button:hover {
      background: #f0f0f0;
    }

    #btnTalk {
      font-weight: bold;
      background: #0066cc;
      color: #fff;
      border-color: #0055aa;
    }

    #btnTalk:hover {
      background: #0055aa;
    }

    #btnFinish {
      display: none;
      font-weight: bold;
      background: #2e7d32;
      color: #fff;
      border-color: #1b5e20;
    }

    #btnFinish:hover {
      background: #1b5e20;
    }

    #btnStop {
      display: none;
      font-weight: bold;
      background: #d32f2f;
      color: #fff;
      border-color: #b71c1c;
    }

    #btnStop:hover {
      background: #b71c1c;
    }

    #btnReset {
      font-weight: bold;
      background: #fbc02d;
      color: #212121;
      border-color: #f57f17;
    }

    #btnReset:hover {
      background: #f9a825;
    }

    .row {
      margin: 14px 0;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      min-height: 44px;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafafa;
    }

    pre.box {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 14px;
      margin: 0;
      background: #fdfdfd;
    }

    #state {
      font-weight: bold;
    }


    #err {
      color: #d32f2f;
      font-weight: 500;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <h3>Voicebot</h3>

  <div class="row">
    Trạng thái: <span id="state">Đang kết nối...</span>
  </div>

  <div class="row">
    <button id="btnTalk">Bắt đầu nói</button>
    <button id="btnFinish">Gửi</button>
    <button id="btnStop">Dừng nói</button>
    <button id="btnReset">Hội thoại mới</button>
  </div>

  <div class="row">
    <b>Bạn:</b>
    <div id="you" class="box"></div>
  </div>

  <div class="row">
    <b>Bot:</b>
    <pre id="bot" class="box"></pre>
  </div>

  <div class="row" id="err"></div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const TARGET_SR = 16000, FRAME_SAMPLES = 1600, TTS_SR = 48000;
      const LABEL = { idle: 'Rảnh', listening: 'Đang nghe...', thinking: 'Đang suy nghĩ', speaking: 'Đang nói' };

      let ws, ctx, micStream, micSource, processor;
      let recording = false, callActive = false, srvState = 'idle';
      const pendingAudio = new Float32Array(FRAME_SAMPLES);
      let pendingLength = 0;
      let resamplePhase = 0;
      let resamplePrevSample = null;
      let playHead = 0, carry = new Uint8Array(0), discarding = false;
      let ttsSr = TTS_SR;
      let waitAudioEndTimer = null, autoListenTimer = null;
      const sources = new Set();

      function clearAutoListenTimers() {
        if (waitAudioEndTimer !== null) {
          clearInterval(waitAudioEndTimer);
          waitAudioEndTimer = null;
        }
        if (autoListenTimer !== null) {
          clearTimeout(autoListenTimer);
          autoListenTimer = null;
        }
      }

      // Reset bộ đệm và trạng thái resample
      function resetAudioInputState() {
        pendingLength = 0;
        resamplePhase = 0;
        resamplePrevSample = null;
      }

      const sendJson = obj => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); };
      const setErr = msg => { $('err').textContent = msg || ''; };

      function setButtonsState(isSpeaking) {
        $('btnTalk').style.display = isSpeaking ? 'none' : 'inline-block';
        $('btnFinish').style.display = isSpeaking ? 'inline-block' : 'none';
        $('btnStop').style.display = isSpeaking ? 'inline-block' : 'none';
        if (!isSpeaking) {
          $('btnTalk').textContent = 'Bắt đầu nói';
          $('btnTalk').style.background = '#0066cc';
        }
      }

      // Kết nối WebSocket
      function connect() {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(proto + location.host + '/ws/voice');
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => {
          srvState = 'idle';
          sendJson({ type: 'config', auto_turn: true });
          refreshState();
        };
        ws.onclose = () => {
          clearAutoListenTimers();
          recording = false;
          callActive = false;
          resetAudioInputState();
          stopPlayback();
          $('state').textContent = 'Mất kết nối (Hãy tải lại trang)';
          setButtonsState(false);
          setErr('Mất kết nối với máy chủ. Vui lòng tải lại trang.');
        };
        ws.onmessage = onMessage;
      }

      // Trạng thái phát âm thanh và giao diện
      const isPlaying = () => {
        if (!ctx) return false;
        if (sources.size > 0) return true;
        return playHead > ctx.currentTime + 0.05;
      };

      function refreshState() {
        let s = srvState;
        if (recording) s = 'listening';
        else if (s === 'idle' && isPlaying()) s = 'speaking';
        if (ws && ws.readyState === WebSocket.OPEN) $('state').textContent = LABEL[s] || s;
      }
      setInterval(refreshState, 200);

      // Khởi tạo AudioContext, Micro và bộ lọc
      async function ensureAudio() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === 'suspended') await ctx.resume();
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: false
            },
            video: false
          });
          micSource = ctx.createMediaStreamSource(micStream);
          const track = micStream.getAudioTracks()[0];
          if (track) {
            console.log("Mic settings:", track.getSettings());
            console.log("Mic constraints:", track.getConstraints());
          }

          // Lọc chống aliasing (Butterworth bậc 4, 7.2 kHz)
          const lowpass1 = ctx.createBiquadFilter();
          lowpass1.type = 'lowpass';
          lowpass1.frequency.value = 7200;
          lowpass1.Q.value = 0.5411961;

          const lowpass2 = ctx.createBiquadFilter();
          lowpass2.type = 'lowpass';
          lowpass2.frequency.value = 7200;
          lowpass2.Q.value = 1.306563;

          micSource.connect(lowpass1);
          lowpass1.connect(lowpass2);

          processor = ctx.createScriptProcessor(2048, 1, 1);
          processor.onaudioprocess = onMic;
          lowpass2.connect(processor);

          // Nối qua Gain(0) để kích hoạt processor mà không phát ra loa
          const mute = ctx.createGain();
          mute.gain.value = 0;
          processor.connect(mute);
          mute.connect(ctx.destination);
        }
      }

      // Xử lý stream microphone (resample 16kHz -> đệm 1600 mẫu -> gửi WebSocket)
      function onMic(e) {
        if (!recording || !ws || ws.readyState !== WebSocket.OPEN) return;
        if (srvState === 'thinking' || srvState === 'speaking' || isPlaying()) return;

        const input = e.inputBuffer.getChannelData(0);
        const samples = resample(input, ctx.sampleRate, TARGET_SR);

        let offset = 0;
        while (offset < samples.length) {
          const available = FRAME_SAMPLES - pendingLength;
          const count = Math.min(available, samples.length - offset);

          pendingAudio.set(
            samples.subarray(offset, offset + count),
            pendingLength
          );

          pendingLength += count;
          offset += count;

          if (pendingLength === FRAME_SAMPLES) {
            ws.send(toPcm16(pendingAudio));
            pendingLength = 0;
          }
        }
      }

      // Hạ tần số lấy mẫu (nội suy tuyến tính liên tục giữa các block)
      function resample(input, srcSr, dstSr) {
        if (input.length === 0) {
          return new Float32Array(0);
        }

        if (srcSr === dstSr) {
          return input;
        }

        const step = srcSr / dstSr;
        const out = new Float32Array(
          Math.ceil(input.length * dstSr / srcSr) + 2
        );

        let x = resamplePhase;
        let count = 0;

        while (x < input.length - 1) {
          const x0 = Math.floor(x);
          const x1 = x0 + 1;
          const t = x - x0;

          const a = x0 < 0
            ? resamplePrevSample
            : input[x0];

          const b = input[x1];

          out[count++] = a * (1 - t) + b * t;

          x += step;
        }

        resamplePhase = x - input.length;
        resamplePrevSample = input[input.length - 1];

        return out.subarray(0, count);
      }

      // Chuyển Float32 [-1, 1] sang Int16 PCM
      function toPcm16(f32) {
        const pcm = new Int16Array(f32.length);
        for (let i = 0; i < f32.length; i++) {
          const s = Math.max(-1, Math.min(1, f32[i]));
          pcm[i] = s < 0 ? Math.round(s * 32768) : Math.round(s * 32767);
        }
        return pcm.buffer;
      }

      // Kết thúc lượt nói và gửi phần âm thanh còn dư
      function stopTalking() {
        if (!recording) return;
        clearAutoListenTimers();
        recording = false;
        if (pendingLength > 0 && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(toPcm16(pendingAudio.subarray(0, pendingLength)));
        }
        resetAudioInputState();
        sendJson({ type: 'stop_turn' });
      }

      // Dừng phát âm thanh
      function stopPlayback() {
        for (const src of sources) {
          try { src.stop(); } catch (_) { }
        }
        sources.clear();
        playHead = 0;
        carry = new Uint8Array(0);
        discarding = true;
        refreshState();
      }

      // Phát luồng âm thanh PCM từ máy chủ
      function playPcm(arrayBuf) {
        if (!ctx || discarding) return;

        // Ghép byte lẻ đảm bảo căn chỉnh 16-bit
        const bytes = new Uint8Array(carry.length + arrayBuf.byteLength);
        bytes.set(carry, 0);
        bytes.set(new Uint8Array(arrayBuf), carry.length);

        const even = bytes.length - (bytes.length % 2);
        carry = bytes.slice(even);
        if (even === 0) return;

        const i16 = new Int16Array(bytes.buffer.slice(0, even));
        const f32 = new Float32Array(i16.length);
        for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;

        const audioBuf = ctx.createBuffer(1, f32.length, ttsSr);
        audioBuf.copyToChannel(f32, 0);

        const source = ctx.createBufferSource();
        source.buffer = audioBuf;
        source.connect(ctx.destination);

        const now = ctx.currentTime;
        if (playHead < now + 0.05) playHead = now + 0.08;
        source.start(playHead);
        playHead += audioBuf.duration;
        sources.add(source);
        source.onended = () => {
          sources.delete(source);
          refreshState();
        };
      }

      // Xử lý thông điệp từ máy chủ
      function onMessage(ev) {
        if (typeof ev.data !== 'string') {
          playPcm(ev.data);
          return;
        }
        let m;
        try {
          m = JSON.parse(ev.data);
        } catch (err) {
          console.error("WebSocket JSON không hợp lệ:", ev.data, err);
          return;
        }
        switch (m.type) {
          case 'tts_format':
            if (m.sample_rate) ttsSr = m.sample_rate;
            break;
          case 'state':
            srvState = m.state;
            if (m.state === 'listening') discarding = false;
            if (m.state === 'thinking' || m.state === 'speaking') {
              recording = false;
              resetAudioInputState();
            }
            refreshState();
            break;
          case 'auto_stop':
            if (m.reason === 'filler_timeout') {
              setErr('Tự động ngắt: Hết thời gian chờ từ đệm (im lặng >2.0s)');
            } else if (m.reason === 'silence_timeout') {
              setErr('Tự động ngắt: Hết thời gian im lặng (>2.0s)');
            } else {
              setErr(`Tự động ngắt khi dứt câu (Độ tin cậy: ${(m.probability * 100).toFixed(1)}%)`);
            }
            if (pendingLength > 0 && ws && ws.readyState === WebSocket.OPEN) {
              ws.send(toPcm16(pendingAudio.subarray(0, pendingLength)));
            }
            resetAudioInputState();
            recording = false;
            break;
          case 'partial':
            $('you').textContent = m.text;
            break;
          case 'final':
            $('you').textContent = m.text;
            $('bot').textContent = '';
            break;
          case 'bot_raw':
            $('bot').textContent += m.text;
            break;
          case 'bot_done':
            // Chờ phát hết âm thanh + 600ms chống dội âm rồi tự động nghe tiếp
            recording = false;
            resetAudioInputState();
            clearAutoListenTimers();
            waitAudioEndTimer = setInterval(() => {
              if (!isPlaying()) {
                clearInterval(waitAudioEndTimer);
                waitAudioEndTimer = null;
                autoListenTimer = setTimeout(() => {
                  autoListenTimer = null;
                  if (callActive && !recording && srvState === 'idle') {
                    resetAudioInputState();
                    recording = true;
                    sendJson({ type: 'start_turn' });
                    setButtonsState(true);
                    refreshState();
                  }
                }, 600);
              }
            }, 100);
            break;
          case 'stop_audio':
            stopPlayback();
            break;
          case 'busy':
            setErr('Bot đang nói. Vui lòng chờ bot nói xong.');
            break;
          case 'info':
            setErr(m.message);
            break;
          case 'error':
            setErr(m.message);
            clearAutoListenTimers();
            callActive = false;
            recording = false;
            resetAudioInputState();
            setButtonsState(false);
            break;
          case 'metrics':
            break;
        }
      }

      // Sự kiện nút bấm
      $('btnTalk').onclick = async () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          setErr('Chưa kết nối được máy chủ. Vui lòng thử lại sau giây lát.');
          return;
        }
        clearAutoListenTimers();
        const busy = srvState === 'thinking' || srvState === 'speaking' || isPlaying();
        if (busy) {
          setErr('Bot đang nói. Vui lòng chờ bot nói xong.');
          return;
        }
        try {
          await ensureAudio();
        } catch (e) {
          setErr('Không mở được micro: ' + e.message);
          return;
        }

        stopPlayback();
        setErr('');
        $('you').textContent = '';
        $('bot').textContent = '';
        resetAudioInputState();
        callActive = true;
        recording = true;
        sendJson({ type: 'start_turn' });
        setButtonsState(true);
      };

      $('btnFinish').onclick = () => {
        stopTalking();
      };

      $('btnStop').onclick = () => {
        clearAutoListenTimers();
        callActive = false;
        recording = false;
        resetAudioInputState();
        stopPlayback();
        setButtonsState(false);
        sendJson({ type: 'interrupt' });
        refreshState();
      };

      $('btnReset').onclick = () => {
        clearAutoListenTimers();
        callActive = false;
        recording = false;
        resetAudioInputState();
        stopPlayback();
        sendJson({ type: 'reset' });
        $('you').textContent = '';
        $('bot').textContent = '';
        setButtonsState(false);
        setErr('');
        refreshState();
      };

      connect();
    })();
  </script>
</body>

</html>
