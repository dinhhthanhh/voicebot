<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voicebot Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 860px;
      margin: 24px auto;
      padding: 0 16px;
      color: #222;
    }

    h3 {
      margin-bottom: 16px;
    }

    button {
      font-size: 15px;
      padding: 8px 16px;
      margin-right: 8px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
    }

    button:hover {
      background: #f0f0f0;
    }

    .btn-ctrl {
      font-weight: bold;
    }

    #btnTalk {
      background: #0066cc;
      color: #fff;
      border-color: #0055aa;
    }

    #btnTalk:hover {
      background: #0055aa;
    }

    #btnFinish {
      display: none;
      background: #2e7d32;
      color: #fff;
      border-color: #1b5e20;
    }

    #btnFinish:hover {
      background: #1b5e20;
    }

    #btnStop {
      display: none;
      background: #d32f2f;
      color: #fff;
      border-color: #b71c1c;
    }

    #btnStop:hover {
      background: #b71c1c;
    }

    #btnReset {
      background: #fbc02d;
      color: #212121;
      border-color: #f57f17;
    }

    #btnReset:hover {
      background: #f9a825;
    }

    .row {
      margin: 14px 0;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      min-height: 44px;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafafa;
    }

    pre.box {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 14px;
      margin: 0;
      background: #fdfdfd;
    }

    #state {
      font-weight: bold;
    }

    #err {
      color: #d32f2f;
      font-weight: 500;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <h3>Voicebot</h3>

  <div class="row">
    Trạng thái: <span id="state">Đang kết nối...</span>
  </div>

  <div class="row">
    <button id="btnTalk" class="btn-ctrl">Bắt đầu nói</button>
    <button id="btnFinish" class="btn-ctrl">Gửi</button>
    <button id="btnStop" class="btn-ctrl">Dừng nói</button>
    <button id="btnReset" class="btn-ctrl">Hội thoại mới</button>
  </div>

  <div class="row">
    <b>Bạn:</b>
    <div id="you" class="box"></div>
  </div>

  <div class="row">
    <b>Bot:</b>
    <pre id="bot" class="box"></pre>
  </div>

  <div class="row" id="err"></div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const TARGET_SR = 16000, FRAME_SAMPLES = 1600, TTS_SR = 48000;
      const STATE_LABELS = { idle: 'Rảnh', listening: 'Đang nghe...', thinking: 'Đang suy nghĩ', speaking: 'Đang nói' };

      let ws, ctx, micStream, micSource, processor;
      let workletRegistered = false;
      let onWorkletFlushed = null;
      let recording = false, callActive = false, serverState = 'idle';
      const frameBuf = new Float32Array(FRAME_SAMPLES);
      let frameFill = 0;
      let resamplePhase = 0;
      let resamplePrevSample = null;
      let playHead = 0, oddByte = new Uint8Array(0), discarding = false;
      let ttsSr = TTS_SR;
      let waitAudioEndTimer = null, autoListenTimer = null;
      const playingSources = new Set();

      function clearAutoListenTimers() {
        if (waitAudioEndTimer !== null) {
          clearInterval(waitAudioEndTimer);
          waitAudioEndTimer = null;
        }
        if (autoListenTimer !== null) {
          clearTimeout(autoListenTimer);
          autoListenTimer = null;
        }
      }

      function resetAudioInputState() {
        frameFill = 0;
        resamplePhase = 0;
        resamplePrevSample = null;
        if (processor && processor.port) {
          processor.port.postMessage({ type: 'reset' });
        }
      }

      const isWsOpen = () => ws && ws.readyState === WebSocket.OPEN;
      const sendJson = obj => { if (isWsOpen()) ws.send(JSON.stringify(obj)); };
      const setErr = msg => { $('err').textContent = msg || ''; };

      function setCallButtons(inCall) {
        $('btnTalk').style.display = inCall ? 'none' : 'inline-block';
        $('btnFinish').style.display = inCall ? 'inline-block' : 'none';
        $('btnStop').style.display = inCall ? 'inline-block' : 'none';
      }

      function isBotBusy() {
        return serverState === 'thinking' || serverState === 'speaking' || isPlaying();
      }

      function releaseMicrophone() {
        if (processor) {
          if (processor.port) {
            processor.port.onmessage = null;
          }
          processor.onaudioprocess = null;
          try { processor.disconnect(); } catch (_) { }
          processor = null;
        }
        if (micSource) {
          try { micSource.disconnect(); } catch (_) { }
          micSource = null;
        }
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
      }

      function teardownCallState() {
        clearAutoListenTimers();
        onWorkletFlushed = null;
        callActive = false;
        recording = false;
        resetAudioInputState();
        stopPlayback();
        releaseMicrophone();
        setCallButtons(false);
        refreshState();
      }

      function startListeningTurn() {
        resetAudioInputState();
        recording = true;
        sendJson({ type: 'start_turn' });
        setCallButtons(true);
        refreshState();
      }

      function connect() {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(proto + location.host + '/ws/voice');
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => {
          serverState = 'idle';
          sendJson({ type: 'config', auto_turn: true });
          refreshState();
        };
        ws.onclose = () => {
          teardownCallState();
          $('state').textContent = 'Mất kết nối (Hãy tải lại trang)';
          setErr('Mất kết nối với máy chủ. Vui lòng tải lại trang.');
          refreshState();
        };
        ws.onerror = () => {
          setErr('Lỗi kết nối WebSocket.');
        };
        ws.onmessage = onMessage;
      }

      function refreshState() {
        const finishBtn = $('btnFinish');
        if (finishBtn) {
          finishBtn.disabled = !recording;
          finishBtn.style.opacity = recording ? '1' : '0.5';
          finishBtn.style.cursor = recording ? 'pointer' : 'not-allowed';
        }

        if (!ws || ws.readyState !== WebSocket.OPEN) {
          $('state').textContent = 'Mất kết nối';
          return;
        }
        if (isPlaying()) {
          $('state').textContent = 'Bot đang nói';
          return;
        }
        if (serverState === 'idle' && callActive && !recording) {
          $('state').textContent = 'Chờ nghe tiếp...';
          return;
        }
        $('state').textContent = STATE_LABELS[serverState] || serverState;
      }

      function isPlaying() {
        return playingSources.size > 0;
      }

      function toPcm16(float32) {
        const buf = new ArrayBuffer(float32.length * 2);
        const view = new DataView(buf);
        for (let i = 0; i < float32.length; i++) {
          const s = Math.max(-1, Math.min(1, float32[i]));
          view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        }
        return buf;
      }

      function resampleChunk(chunk, inRate, outRate) {
        if (inRate === outRate) return chunk;
        const ratio = inRate / outRate;
        const outLen = Math.floor((chunk.length - resamplePhase) / ratio);
        if (outLen <= 0) {
          resamplePhase -= chunk.length;
          return new Float32Array(0);
        }
        const out = new Float32Array(outLen);
        for (let i = 0; i < outLen; i++) {
          const pos = resamplePhase + i * ratio;
          const i0 = Math.floor(pos);
          const i1 = i0 + 1;
          const frac = pos - i0;
          const p0 = (i0 < 0) ? (resamplePrevSample ?? chunk[0]) : chunk[i0];
          const p1 = (i1 < chunk.length) ? chunk[i1] : chunk[chunk.length - 1];
          out[i] = p0 + (p1 - p0) * frac;
        }
        resamplePhase = (resamplePhase + outLen * ratio) - chunk.length;
        resamplePrevSample = chunk[chunk.length - 1];
        return out;
      }

      // Xử lý stream microphone (resample 16kHz -> đệm 1600 mẫu -> gửi WebSocket)
      function onMic(e) {
        if (!recording || !isWsOpen()) return;
        if (isBotBusy()) return;

        const inputData = e.inputBuffer.getChannelData(0);
        const resampled = resampleChunk(inputData, ctx.sampleRate, TARGET_SR);
        let offset = 0;
        while (offset < resampled.length) {
          const needed = FRAME_SAMPLES - frameFill;
          const toCopy = Math.min(needed, resampled.length - offset);
          frameBuf.set(resampled.subarray(offset, offset + toCopy), frameFill);
          frameFill += toCopy;
          offset += toCopy;
          if (frameFill === FRAME_SAMPLES) {
            ws.send(toPcm16(frameBuf));
            frameFill = 0;
          }
        }
      }

      const WORKLET_CODE = `
class MicProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.resamplePhase = 0;
    this.resamplePrevSample = null;
    this.frameSamples = 1600;
    this.targetSr = 16000;
    this.buf = new Float32Array(this.frameSamples);
    this.fill = 0;

    this.port.onmessage = (e) => {
      if (e.data && e.data.type === 'reset') {
        this.fill = 0;
        this.resamplePhase = 0;
        this.resamplePrevSample = null;
      } else if (e.data && e.data.type === 'flush') {
        this.flush();
      }
    };
  }

  flush() {
    if (this.fill > 0) {
      const pcm = new ArrayBuffer(this.fill * 2);
      const view = new DataView(pcm);
      for (let i = 0; i < this.fill; i++) {
        const s = Math.max(-1, Math.min(1, this.buf[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      this.port.postMessage({ flushed: true, pcm }, [pcm]);
      this.fill = 0;
    } else {
      this.port.postMessage({ flushed: true, pcm: null });
    }
  }

  process(inputs) {
    const input = inputs[0];
    if (!input || !input[0] || input[0].length === 0) return true;
    const chunk = input[0];
    const inRate = sampleRate;
    const outRate = this.targetSr;
    const ratio = inRate / outRate;
    const outLen = Math.floor((chunk.length - this.resamplePhase) / ratio);
    if (outLen <= 0) {
      this.resamplePhase -= chunk.length;
      return true;
    }
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const pos = this.resamplePhase + i * ratio;
      const i0 = Math.floor(pos);
      const frac = pos - i0;
      const p0 = (i0 < 0) ? (this.resamplePrevSample ?? chunk[0]) : chunk[i0];
      const p1 = (i0 + 1 < chunk.length) ? chunk[i0 + 1] : chunk[chunk.length - 1];
      out[i] = p0 + (p1 - p0) * frac;
    }
    this.resamplePhase = (this.resamplePhase + outLen * ratio) - chunk.length;
    this.resamplePrevSample = chunk[chunk.length - 1];

    let offset = 0;
    while (offset < out.length) {
      const needed = this.frameSamples - this.fill;
      const toCopy = Math.min(needed, out.length - offset);
      this.buf.set(out.subarray(offset, offset + toCopy), this.fill);
      this.fill += toCopy;
      offset += toCopy;
      if (this.fill === this.frameSamples) {
        const pcm = new ArrayBuffer(this.frameSamples * 2);
        const view = new DataView(pcm);
        for (let i = 0; i < this.frameSamples; i++) {
          const s = Math.max(-1, Math.min(1, this.buf[i]));
          view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        }
        this.port.postMessage({ flushed: false, pcm }, [pcm]);
        this.fill = 0;
      }
    }
    return true;
  }
}
registerProcessor('mic-processor', MicProcessor);
`;

      async function ensureAudio() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === 'suspended') await ctx.resume();
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: false
            },
            video: false
          });
          micSource = ctx.createMediaStreamSource(micStream);

          // Lọc chống aliasing (Butterworth bậc 4, 7.2 kHz)
          const lowpass1 = ctx.createBiquadFilter();
          lowpass1.type = 'lowpass';
          lowpass1.frequency.value = 7200;
          lowpass1.Q.value = 0.5411961;

          const lowpass2 = ctx.createBiquadFilter();
          lowpass2.type = 'lowpass';
          lowpass2.frequency.value = 7200;
          lowpass2.Q.value = 1.306563;

          micSource.connect(lowpass1);
          lowpass1.connect(lowpass2);

          let useWorklet = false;
          if (ctx.audioWorklet && typeof ctx.audioWorklet.addModule === 'function') {
            try {
              if (!workletRegistered) {
                const workletBlob = new Blob([WORKLET_CODE], { type: 'application/javascript' });
                const workletUrl = URL.createObjectURL(workletBlob);
                await ctx.audioWorklet.addModule(workletUrl);
                URL.revokeObjectURL(workletUrl);
                workletRegistered = true;
              }

              const workletNode = new AudioWorkletNode(ctx, 'mic-processor');
              workletNode.port.onmessage = (e) => {
                const { flushed, pcm } = e.data || {};
                if (pcm && (recording || flushed) && isWsOpen() && !isBotBusy()) {
                  ws.send(pcm);
                }
                if (flushed && typeof onWorkletFlushed === 'function') {
                  const cb = onWorkletFlushed;
                  onWorkletFlushed = null;
                  cb();
                }
              };
              lowpass2.connect(workletNode);

              const mute = ctx.createGain();
              mute.gain.value = 0;
              workletNode.connect(mute);
              mute.connect(ctx.destination);

              processor = workletNode;
              useWorklet = true;
            } catch (err) {
              console.warn("AudioWorklet không khởi tạo được, dùng ScriptProcessor fallback:", err);
            }
          }

          if (!useWorklet) {
            processor = ctx.createScriptProcessor(2048, 1, 1);
            processor.onaudioprocess = onMic;
            lowpass2.connect(processor);

            // Nối qua Gain(0) để kích hoạt processor mà không phát ra loa
            const mute = ctx.createGain();
            mute.gain.value = 0;
            processor.connect(mute);
            mute.connect(ctx.destination);
          }
        }
      }

      function stopTalking() {
        if (!recording) return;
        recording = false;
        refreshState();

        if (processor && processor.port) {
          let sent = false;
          const finishTurn = () => {
            if (sent) return;
            sent = true;
            onWorkletFlushed = null;
            resetAudioInputState();
            sendJson({ type: 'stop_turn' });
          };
          onWorkletFlushed = finishTurn;
          processor.port.postMessage({ type: 'flush' });
          setTimeout(finishTurn, 100);
        } else {
          if (frameFill > 0 && isWsOpen()) {
            ws.send(toPcm16(frameBuf.subarray(0, frameFill)));
          }
          resetAudioInputState();
          sendJson({ type: 'stop_turn' });
        }
      }

      function stopPlayback() {
        for (const src of playingSources) {
          try { src.stop(); } catch (_) { }
        }
        playingSources.clear();
        playHead = 0;
        oddByte = new Uint8Array(0);
        discarding = true;
        refreshState();
      }

      // Phát luồng âm thanh PCM từ máy chủ
      function playPcm(arrayBuf) {
        if (!ctx || discarding || !arrayBuf || arrayBuf.byteLength === 0) return;

        let i16;
        if (oddByte.length === 0) {
          const byteLen = arrayBuf.byteLength;
          if (byteLen % 2 === 0) {
            i16 = new Int16Array(arrayBuf);
          } else {
            const evenLen = byteLen - 1;
            i16 = new Int16Array(arrayBuf, 0, evenLen / 2);
            oddByte = new Uint8Array(arrayBuf, evenLen, 1).slice();
          }
        } else {
          const totalLen = oddByte.length + arrayBuf.byteLength;
          const evenLen = totalLen - (totalLen % 2);
          const combined = new Uint8Array(evenLen);
          combined.set(oddByte, 0);
          const chunkTake = evenLen - oddByte.length;
          combined.set(new Uint8Array(arrayBuf, 0, chunkTake), oddByte.length);
          if (totalLen > evenLen) {
            oddByte = new Uint8Array(arrayBuf, chunkTake, 1).slice();
          } else {
            oddByte = new Uint8Array(0);
          }
          i16 = new Int16Array(combined.buffer);
        }

        if (i16.length === 0) return;

        const audioBuf = ctx.createBuffer(1, i16.length, ttsSr);
        const channelData = audioBuf.getChannelData(0);
        for (let i = 0; i < i16.length; i++) {
          channelData[i] = i16[i] / 32768;
        }

        const source = ctx.createBufferSource();
        source.buffer = audioBuf;
        source.connect(ctx.destination);

        const now = ctx.currentTime;
        if (playHead < now + 0.05) playHead = now + 0.08;
        source.start(playHead);
        playHead += audioBuf.duration;
        playingSources.add(source);
        source.onended = () => {
          playingSources.delete(source);
          refreshState();
        };
      }

      function handleAutoStop(m) {
        if (m.reason === 'filler_timeout') {
          setErr('Tự động ngắt: Hết thời gian chờ từ đệm (im lặng >2.0s)');
        } else if (m.reason === 'silence_timeout') {
          setErr('Tự động ngắt: Hết thời gian im lặng');
        } else if (m.reason === 'sequence_done') {
          setErr(`Tự động ngắt khi đọc xong mã/số (Độ tin cậy: ${(m.probability * 100).toFixed(1)}%)`);
        } else {
          setErr(`Tự động ngắt khi dứt câu (Độ tin cậy: ${(m.probability * 100).toFixed(1)}%)`);
        }
        resetAudioInputState();
        recording = false;
      }

      function scheduleAutoListen() {
        // Chờ phát hết âm thanh + 600ms chống dội âm rồi tự động nghe tiếp
        recording = false;
        resetAudioInputState();
        clearAutoListenTimers();
        waitAudioEndTimer = setInterval(() => {
          if (!isPlaying()) {
            clearInterval(waitAudioEndTimer);
            waitAudioEndTimer = null;
            autoListenTimer = setTimeout(() => {
              autoListenTimer = null;
              if (callActive && !recording && serverState === 'idle') {
                startListeningTurn();
              }
            }, 600);
          }
        }, 100);
      }

      const messageHandlers = {
        tts_format(m) {
          if (m.sample_rate) ttsSr = m.sample_rate;
        },
        state(m) {
          serverState = m.state;
          if (m.state === 'listening') discarding = false;
          if (m.state === 'thinking' || m.state === 'speaking') {
            recording = false;
            resetAudioInputState();
          }
          refreshState();
        },
        auto_stop: handleAutoStop,
        partial(m) {
          $('you').textContent = m.text;
        },
        final(m) {
          $('you').textContent = m.text;
          $('bot').textContent = '';
        },
        bot_raw(m) {
          $('bot').textContent += m.text;
        },
        bot_done: scheduleAutoListen,
        stop_audio: stopPlayback,
        busy() {
          setErr('Bot đang nói. Vui lòng chờ bot nói xong.');
        },
        info(m) {
          setErr(m.message);
        },
        error(m) {
          setErr(m.message);
          teardownCallState();
        },
        metrics() { },
      };

      function onMessage(ev) {
        if (typeof ev.data !== 'string') {
          playPcm(ev.data);
          return;
        }
        try {
          const m = JSON.parse(ev.data);
          const handler = messageHandlers[m.type];
          if (handler) {
            handler(m);
          }
        } catch (err) {
          console.error("WebSocket JSON không hợp lệ:", ev.data, err);
        }
      }

      // Sự kiện nút bấm
      $('btnTalk').onclick = async () => {
        if (!isWsOpen()) {
          setErr('Chưa kết nối được máy chủ. Vui lòng thử lại sau giây lát.');
          return;
        }
        clearAutoListenTimers();
        if (isBotBusy()) {
          setErr('Bot đang nói. Vui lòng chờ bot nói xong.');
          return;
        }

        // Dọn dẹp trạng thái cũ TRƯỚC khi mở micro
        teardownCallState();

        try {
          await ensureAudio();
        } catch (e) {
          setErr('Không mở được micro: ' + e.message);
          return;
        }

        setErr('');
        $('you').textContent = '';
        $('bot').textContent = '';
        callActive = true;
        startListeningTurn();
      };

      $('btnFinish').onclick = () => {
        stopTalking();
      };

      $('btnStop').onclick = () => {
        teardownCallState();
        sendJson({ type: 'interrupt' });
        refreshState();
      };

      $('btnReset').onclick = () => {
        teardownCallState();
        sendJson({ type: 'reset' });
        $('you').textContent = '';
        $('bot').textContent = '';
        setErr('');
        refreshState();
      };

      connect();
    })();
  </script>
</body>

</html>
